# Fábrica: site estático do Vite. Sem variáveis do Supabase, roda no modo local (sem login, dados no navegador).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # A biblioteca de voz abre um WebSocket (ws, com addons nativos opcionais): vai inteira, sem empacotar.
  external_node_modules = ["msedge-tts"]

# Voz dos vídeos: função que fala com o serviço de vozes da Microsoft.
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

# Rotas do app (/criar, /agenda, /carrossel/:id...) sempre abrem o index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
